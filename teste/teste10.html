<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conta</title>
    <link rel="stylesheet" href="teste10.css">
  </head>
  <body>
    <header>
    <div class="container">
      <h1>Calculadora Simples</h1>
    
      <input type="number" id="num1" placeholder="Digite o 1º número" />
      <input type="number" id="num2" placeholder="Digite o 2º número" />
      <button onclick="calcular()">Calcular Soma</button>

      <div id="resultado" class="resultado"></div>
    </div>

    <script>
      function calcular() {
        let num1 = parseFloat(document.getElementById('num1').value);
        let num2 = parseFloat(document.getElementById('num2').value);
        let resultadoDiv = document.getElementById('resultado');
        let soma;

        if (isNaN(num1) || isNaN(num2)) {
          resultadoDiv.textContent = 'Por favor, insira dois números válidos.';
        } else {
          soma = num1 + num2;
          resultadoDiv.textContent = `${num1} + ${num2} = ${soma}`;
        }
      }
    </script>
  </body>
</html>
