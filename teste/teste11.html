<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>teste11</title>
  <script>
  document.addEventlistener("DOMContentLoaded", function(){
  let txt = document.getElementById('texto');
  txt.textContent = "esato, e du coisa";
   });
   function mudarCor(){
     let txt = document.getElementById('texto');
     txt.style.backgroundColor = "black";
   }
   function mudarTamanho(){
     let img = document.getElementById('img');
     img.width = 300;

   }
</script>
</head>
<body>
  <div>
  <p id="texto">teste</p>
  <button onclick="mudarCor()">Aperta aqui UOUW</button>
  </div>
  <div>
  <img id="img" src="https://idec.org.br/sites/default/files/dicasedireitos/cuscuz.jpg" alt="">
  <button onclick="mudarTamanho()">Mudar tamanho da imagem</button>
  </div>
</body>
</html>
