    <script>

      let trabalho = prompt('Qual seu trabalho');

      alert(`Muito prazer, ${nome} quantos anos tem:  ${idade}  altura:  ${altura} trabalho: ${trabalho}`);

      if (idade > 18){
        alert("voce e maior de idade!");
      }
      else if (idade <18){
        alert("voce e menor de idade!");
      }
      else{
        alert("voce tm 18 anos")
      }
    </script>
