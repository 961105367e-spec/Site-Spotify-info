<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="cadastro.css" />
  </head>

  <body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>

    <nav class="btn-login-final">
      <a href="siteee.html" class="btn-login-final">site</a>
    </nav>

    <div class="container">
      <div class="card">
        <h1>Cadastre-se grátis</h1>

        <form id="formCadastro">
          <label>Nome completo</label>
          <input id="nome" type="text" placeholder="Seu nome" required />

          <label>E-mail</label>
          <input id="email" type="email" placeholder="seu@email.com" required />

          <label>Senha</label>
          <input
            id="senha"
            type="password"
            placeholder="Mínimo 8 caracteres"
            minlength="8"
            required
          />

          <label>Gênero</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="genero" value="Masculino" required />
              Masculino
            </label>

            <label class="radio-label">
              <input type="radio" name="genero" value="Feminino" /> Feminino
            </label>

            <label class="radio-label">
              <input type="radio" name="genero" value="Outro" /> Outro
            </label>
          </div>

          <button type="submit" class="btn-submit">Criar conta</button>
        </form>

        <div id="resultado" style="margin-top: 20px"></div>
      </div>
    </div>

    <script>
      const form = document.getElementById('formCadastro');
      const resultado = document.getElementById('resultado');

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const nome = document.getElementById('nome').value;
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        const genero = document.querySelector(
          "input[name='genero']:checked"
        ).value;

        resultado.innerHTML = `
          <div class="alert alert-dark">
            <h4>Verifique seus dados:</h4>
            <p><strong>Nome:</strong> ${nome}</p>
            <p><strong>E-mail:</strong> ${email}</p>
            <p><strong>Senha:</strong> ${senha}</p>
            <p><strong>Gênero:</strong> ${genero}</p>

            <button id="btnConfirmar" class="btn btn-success" style="margin-right: 10px;">Confirmar cadastro</button>
            <button id="btnCancelar" class="btn btn-danger">Cancelar cadastro</button>
          </div>
        `;

        document.getElementById('btnConfirmar').onclick = function () {
          resultado.innerHTML = `<div class="alert alert-success">Cadastro confirmado!</div>`;
          setTimeout(() => (resultado.innerHTML = ''), 2500);
        };

        document.getElementById('btnCancelar').onclick = function () {
          resultado.innerHTML = `<div class="alert alert-danger">Cadastro cancelado!</div>`;
          setTimeout(() => (resultado.innerHTML = ''), 2500);
        };
      });
      const particlesContainer = document.getElementById('particles');
      const particleCount = 50;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');

        const size = Math.random() * 5 + 2;
        const duration = Math.random() * 20 + 15;
        const delay = Math.random() * 10;
        const drift = (Math.random() - 0.5) * 300 + 'px';

        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.setProperty('--drift', drift);
        particle.style.animation = `floatParticle ${duration}s linear ${delay}s infinite`;

        particlesContainer.appendChild(particle);
      }
    </script>
  </body>
</html>
